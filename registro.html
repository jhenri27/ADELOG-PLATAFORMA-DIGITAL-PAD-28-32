<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción Oficial - Pastora Altagracia</title>
    <script>
        // Redirigir de inmediato a frontend/index.html conservando todos los parámetros (?canal=red_ml&ref=...)
        var qs = window.location.search || '';
        window.location.replace("frontend/index.html" + qs);
    </script>
    <meta http-equiv="refresh" content="0; url=frontend/index.html">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loader-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 30px 40px;
            border-radius: 12px;
            border: 1px solid rgba(227, 161, 19, 0.4);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #E3A113;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        a { color: #38bdf8; text-decoration: underline; font-weight: bold; }
    </style>
</head>
<body>
    <div class="loader-card">
        <div class="spinner"></div>
        <h3 style="margin: 0 0 8px 0; color: #E3A113;">Plataforma Oficial Electoral</h3>
        <p style="margin: 0 0 15px 0; color: #cbd5e1; font-size: 14px;">Redirigiendo al formulario de inscripción...</p>
        <p style="margin: 0; font-size: 12px; color: #94a3b8;">
            Si no es redirigido automáticamente, <a id="manual-link" href="frontend/index.html">haga clic aquí</a>.
        </p>
    </div>
    <script>
        document.getElementById('manual-link').href = "frontend/index.html" + (window.location.search || '');
    </script>
</body>
</html>
